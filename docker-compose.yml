version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14
    container_name: restaurant_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend/restaurant_backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/restaurant_db
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    ports:
      - "8000:8000"
    networks:
      - restaurant_network

  # React Frontend
  frontend:
    build:
      context: ./frontend/restaurant_frontend
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - restaurant_network

networks:
  restaurant_network:
    driver: bridge

volumes:
  postgres_data:
